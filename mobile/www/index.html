<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Indulge Academy</title>
    <!--
      This is Capacitor's `webDir`, and it is DELIBERATELY not the app.

      Academy cannot be bundled into the APK: five of its pages are
      force-dynamic RSC, every mutation is a Next.js server action, and the
      persona / evaluator / ticket-reviewer calls are server-side Anthropic
      requests whose API key must never reach a device. `next build` with
      `output: 'export'` would fail outright.

      So capacitor.config.ts points the WebView at the deployed app and this
      page is only ever seen when the device cannot reach it — which is exactly
      when a blank white screen would be least helpful.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #1a1814;
        color: #f9f9f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .mark {
        width: 44px; height: 44px;
        display: grid; place-items: center;
        margin: 0 auto 1.25rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        font-size: 20px;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 600; letter-spacing: 0.01em; }
      p { margin: 0 auto; max-width: 30ch; font-size: 0.9375rem; line-height: 1.55; color: rgba(249, 249, 246, 0.6); }
      button {
        margin-top: 1.75rem;
        padding: 0.8rem 1.75rem;
        border: 0; border-radius: 10px;
        background: #5f5348; color: #f9f9f6;
        font: inherit; font-weight: 600; font-size: 0.9375rem;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .hint { margin-top: 1.25rem; font-size: 0.75rem; color: rgba(249, 249, 246, 0.35); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">&#127891;</div>
      <h1>Can&rsquo;t reach Academy</h1>
      <p>
        Academy needs a connection &mdash; your conversations, tickets and scores
        all live on the Indulge server.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">Check your connection and reopen the app.</p>
    </main>
  </body>
</html>
